name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/OpenPanel.Ui/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install UI dependencies
        working-directory: src/OpenPanel.Ui
        run: npm ci

      - name: Restore .NET dependencies
        run: |
          dotnet restore src/OpenPanel.sln
          dotnet restore src/OpenPanel.Host/OpenPanel.Host.csproj -r win-x64

      - name: Type-check UI
        working-directory: src/OpenPanel.Ui
        run: npm run typecheck

      - name: Build UI
        working-directory: src/OpenPanel.Ui
        run: npm run build

      - name: Test .NET
        run: dotnet test src/OpenPanel.sln -c Release --no-restore

      - name: Publish Windows package
        run: >
          dotnet publish src/OpenPanel.Host/OpenPanel.Host.csproj
          -c Release
          -r win-x64
          --self-contained false
          --no-restore
          -o publish/win-x64

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: OpenPanel-win-x64
          path: publish/win-x64
          if-no-files-found: error
          retention-days: 14
