name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      NUGET_XMLDOC_MODE: skip
      INNO_SETUP_VERSION: "6.7.3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release tag
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Tag must use vMAJOR.MINOR.PATCH format."
          }
          "OPENPANEL_VERSION=$version" >> $env:GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/OpenPanel.Ui/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install UI dependencies
        working-directory: src/OpenPanel.Ui
        run: npm ci

      - name: Restore .NET dependencies
        run: |
          dotnet restore src/OpenPanel.sln
          dotnet restore src/OpenPanel.Host/OpenPanel.Host.csproj -r win-x64

      - name: Test
        run: |
          npm run typecheck --prefix src/OpenPanel.Ui
          dotnet test src/OpenPanel.sln -c Release --no-restore

      - name: Download verified PresentMon runtime
        shell: powershell
        run: .\scripts\setup-presentmon.ps1

      - name: Install verified Inno Setup
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_SETUP_VERSION.exe"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-$env:INNO_SETUP_VERSION.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne "Valid" -or
              $signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\.") {
            throw "Inno Setup signature verification failed: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          Start-Process -FilePath $installer `
            -WindowStyle Hidden `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" `
            -Wait

      - name: Build installer
        shell: powershell
        run: .\scripts\package.ps1 -Version $env:OPENPANEL_VERSION

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenPanel-Setup-${{ env.OPENPANEL_VERSION }}
          path: |
            artifacts/OpenPanel-Setup-${{ env.OPENPANEL_VERSION }}.exe
            artifacts/OpenPanel-Setup-${{ env.OPENPANEL_VERSION }}.exe.sha256
          if-no-files-found: error

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "artifacts/OpenPanel-Setup-$env:OPENPANEL_VERSION.exe"
          $checksum = "$installer.sha256"
          $notes = "docs/releases/$env:GITHUB_REF_NAME.md"
          $arguments = @(
            "release", "create", $env:GITHUB_REF_NAME,
            $installer, $checksum,
            "--verify-tag",
            "--title", "OpenPanel $env:GITHUB_REF_NAME"
          )
          if (Test-Path $notes) {
            $arguments += @("--notes-file", $notes)
          } else {
            $arguments += "--generate-notes"
          }
          & gh @arguments
